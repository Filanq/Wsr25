version: '3.3'

services:
  backend:
    build: ../backend
    command: sh -c "python manage.py migrate && python manage.py loaddata database.json && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/home/app/backend
    restart: always
    depends_on:
      - db
  bot:
    build: ../tg-bot-python
    command: python index.py
    volumes:
      - ../tg-bot-python:/home/app/bot
    restart: always
    depends_on:
      - db
  nginx:
    container_name: nginx
    image: nginx:1.25.4-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist/:/usr/share/nginx/html/
  db:
    image: mysql
    restart: always
    volumes:
      - ../db_data:/var/lib/mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: 'wsr25'
      MYSQL_USER: 'wsr25'
      MYSQL_PASSWORD: 'wsr25'
      MYSQL_ROOT_PASSWORD: 'wsr25'
  phpmyadmin:
    image: adminer
    restart: always
    ports:
      - "8080:8080"